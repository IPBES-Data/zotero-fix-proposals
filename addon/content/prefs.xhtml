<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">
  <groupbox>
    <label><html:h2>Fix Proposals</html:h2></label>
    <html:label>Where the fixes are published: a web address, e.g. the GitHub Pages of the
      report (…/fixes/) or a raw GitHub address, or a local folder (with index.json)
      <html:input type="text" style="width: 100%; box-sizing: border-box;"
                  preference="extensions.fix-proposals.feedURL"/>
    </html:label>
    <html:p>Open the window with Tools → Fix Proposals…. Changes are written only
      through Zotero Safe Edit, after your approval.</html:p>
  </groupbox>
</vbox>
